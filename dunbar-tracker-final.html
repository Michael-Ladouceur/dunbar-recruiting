<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dunbar Recruiting Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a25;
            --accent-orange: #ff6b35;
            --accent-orange-dim: #e55a2b;
            --accent-green: #10b981;
            --text-primary: #ffffff;
            --text-secondary: #8a8a9a;
            --border-subtle: #2a2a35;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 20%, rgba(255, 107, 53, 0.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: var(--bg-dark);
        }

        .auth-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 3rem;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .auth-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.3);
        }

        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .auth-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: var(--bg-dark);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Barlow', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-dim));
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Barlow', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .auth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
        }

        .auth-toggle button {
            background: none;
            border: none;
            color: var(--accent-orange);
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .user-info {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 100;
        }

        .user-email {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Barlow', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #fca5a5;
        }

        header {
            text-align: center;
            padding: 3rem 0 2rem;
        }

        .logo-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin: 2.5rem 0;
            flex-wrap: wrap;
        }

        .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.25rem;
        }

        .progress-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-subtle);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-percentage {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: var(--accent-orange);
        }

        .progress-bar {
            height: 12px;
            background: var(--bg-dark);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-green));
            transition: width 0.5s ease;
        }

        .search-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Barlow', sans-serif;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .schools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .school-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        .school-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .school-card.completed {
            border-color: var(--accent-green);
        }

        .checkbox-wrapper {
            cursor: pointer;
        }

        .checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border-subtle);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
        }

        .school-card.completed .checkbox {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .checkbox svg {
            width: 16px;
            height: 16px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            opacity: 0;
        }

        .school-card.completed .checkbox svg {
            opacity: 1;
        }

        .school-info {
            flex: 1;
        }

        .school-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .school-division {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .form-link {
            width: 44px;
            height: 44px;
            background: var(--bg-dark);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .form-link:hover {
            background: var(--accent-orange);
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--accent-green);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .schools-grid {
                grid-template-columns: 1fr;
            }
            .user-info {
                position: static;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div id="authContainer" class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <img src="https://i.imgur.com/YK8P3Qv.png" alt="Dunbar Tigers">
            </div>
            <h2 class="auth-title">Recruiting Tracker</h2>
            <p class="auth-subtitle">Dunbar High School Football</p>
            
            <div id="errorMessage" class="error-message hidden"></div>
            
            <form id="authForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="authEmail" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="authPassword" class="form-input" required>
                </div>
                <button type="submit" class="auth-btn" id="authSubmitBtn">Sign In</button>
            </form>
            
            <div class="auth-toggle">
                <span id="authToggleText">Don't have an account?</span>
                <button type="button" id="authToggleBtn">Sign Up</button>
            </div>
        </div>
    </div>

    <div id="loadingScreen" class="loading hidden">
        <p>Loading...</p>
    </div>

    <div id="mainApp" class="hidden">
        <div class="user-info">
            <span class="user-email" id="userEmail"></span>
            <button class="logout-btn" id="logoutBtn">Sign Out</button>
        </div>

        <div class="container">
            <header>
                <div class="logo-icon">
                    <img src="https://i.imgur.com/YK8P3Qv.png" alt="Dunbar Tigers">
                </div>
                <h1>Recruiting Questionnaire Tracker</h1>
                <p class="subtitle">Track your progress across college football programs</p>
            </header>

            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total Schools</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="remainingCount">0</div>
                    <div class="stat-label">Remaining</div>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-header">
                    <span>Overall Progress</span>
                    <span class="progress-percentage" id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Search schools...">
            </div>

            <div class="schools-grid" id="schoolsGrid"></div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastMessage">Progress saved!</span>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDXwaRI7gw71aafz0e07rsNCL_93nWbXXQ",
            authDomain: "dunbar-recruiting-tracker.firebaseapp.com",
            projectId: "dunbar-recruiting-tracker",
            storageBucket: "dunbar-recruiting-tracker.firebasestorage.app",
            messagingSenderId: "764915887030",
            appId: "1:764915887030:web:07c96b8596d93a5fd3af7e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const schools = [
            {name: "Ave Maria", division: "NAIA", url: "https://avemariagyrenes.com/sports/2023/7/5/prospective-student-athlete-interest-form.aspx"},
            {name: "Dakota State", division: "NAIA", url: "https://www.frontrush.com/FR_Web_App/Player/PlayerSubmit.aspx?sid=MTgwNzg="},
            {name: "Kentucky Christian", division: "NAIA", url: "https://www.kcu.edu/athletic-recruit-request/"},
            {name: "Southeastern University", division: "NAIA", url: "https://questionnaires.armssoftware.com/246d91c47ae1"},
            {name: "Baldwin Wallace", division: "Division III", url: "https://admission.bw.edu/register/athletic_inquiry"}
        ];

        let currentUser = null;
        let completedSchools = [];
        let searchTerm = '';
        let unsubscribe = null;

        const authContainer = document.getElementById('authContainer');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainApp = document.getElementById('mainApp');
        const schoolsGrid = document.getElementById('schoolsGrid');
        const toast = document.getElementById('toast');

        let isSignUp = false;

        function showToast(msg) {
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function renderSchools() {
            const filtered = schools.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()));
            
            schoolsGrid.innerHTML = filtered.map(school => {
                const isCompleted = completedSchools.includes(school.name);
                return `
                    <div class="school-card ${isCompleted ? 'completed' : ''}" onclick="toggleComplete('${school.name}')">
                        <div class="checkbox-wrapper">
                            <div class="checkbox">
                                <svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"></polyline></svg>
                            </div>
                        </div>
                        <div class="school-info">
                            <div class="school-name">${school.name}</div>
                            <div class="school-division">${school.division}</div>
                        </div>
                        <a href="${school.url}" target="_blank" class="form-link" onclick="event.stopPropagation()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                <polyline points="15,3 21,3 21,9"></polyline>
                                <line x1="10" y1="14" x2="21" y2="3"></line>
                            </svg>
                        </a>
                    </div>
                `;
            }).join('');

            const total = schools.length;
            const completed = completedSchools.length;
            const percent = Math.round((completed / total) * 100);

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('remainingCount').textContent = total - completed;
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';
        }

        window.toggleComplete = async function(schoolName) {
            if (!currentUser) return;
            
            if (completedSchools.includes(schoolName)) {
                completedSchools = completedSchools.filter(s => s !== schoolName);
            } else {
                completedSchools.push(schoolName);
            }
            
            await setDoc(doc(db, 'users', currentUser.uid), {
                email: currentUser.email,
                completedSchools: completedSchools,
                lastUpdated: new Date().toISOString()
            });
            
            renderSchools();
        };

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            
            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        });

        document.getElementById('authToggleBtn').addEventListener('click', () => {
            isSignUp = !isSignUp;
            document.getElementById('authSubmitBtn').textContent = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('authToggleText').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('authToggleBtn').textContent = isSignUp ? 'Sign In' : 'Sign Up';
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderSchools();
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmail').textContent = user.email;
                
                authContainer.classList.add('hidden');
                loadingScreen.classList.remove('hidden');
                
                unsubscribe = onSnapshot(doc(db, 'users', user.uid), (doc) => {
                    if (doc.exists()) {
                        completedSchools = doc.data().completedSchools || [];
                        renderSchools();
                    }
                });
                
                loadingScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                renderSchools();
            } else {
                currentUser = null;
                completedSchools = [];
                if (unsubscribe) unsubscribe();
                mainApp.classList.add('hidden');
                authContainer.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
